<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberHunter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 360px;
            max-height: 580px;
            overflow-y: auto;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #0d0900 0%, #0d0900 100%);
            color: #e8eaed;
            padding: 0;
        }

        .header {
            background: linear-gradient(135deg, #d4a200, #c8a800);
            padding: 20px;
            text-align: center;
            color: #0d0900;
        }

        .logo {
            margin-bottom: 8px;
        }

        .logo img {
            width: 130px;
            height: 130px;
            object-fit: contain;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .tagline {
            font-size: 12px;
            opacity: 0.8;
        }

        .content {
            padding: 20px;
        }

        .status-card {
            background: #221c00;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #4a3c00;
        }

        .status-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .status-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: linear-gradient(135deg, #d4a200, #c8a800);
        }

        .status-text {
            flex: 1;
        }

        .status-title {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .status-subtitle {
            font-size: 12px;
            color: #9aa0a6;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-box {
            background: #221c00;
            border-radius: 10px;
            padding: 14px;
            text-align: center;
            border: 1px solid #4a3c00;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #d4a200, #c8a800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: #9aa0a6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .recent-scans {
            margin-top: 16px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9aa0a6;
            margin-bottom: 10px;
        }

        .scan-list-wrapper {
            max-height: 220px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #4a3c00 transparent;
        }

        .scan-list-wrapper::-webkit-scrollbar {
            width: 4px;
        }

        .scan-list-wrapper::-webkit-scrollbar-track { background: transparent; }
        .scan-list-wrapper::-webkit-scrollbar-thumb { background: #4a3c00; border-radius: 4px; }

        .scan-item {
            background: #221c00;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #4a3c00;
            min-width: 0;
        }

        .scan-icon {
            font-size: 16px;
            flex-shrink: 0;
        }

        .scan-details {
            flex: 1;
            font-size: 12px;
            min-width: 0;
        }

        .scan-subject {
            font-weight: 600;
            color: #e8eaed;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .scan-sender {
            color: #9aa0a6;
            font-size: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 1px;
        }

        .scan-time {
            color: #6b7280;
            font-size: 10px;
            margin-top: 2px;
        }

        .scan-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            flex-shrink: 0;
        }

        .scan-risk {
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .scan-score {
            font-size: 10px;
            color: #9aa0a6;
        }

        .risk-high {
            background: rgba(255, 51, 102, 0.2);
            color: #ff5577;
        }

        .risk-medium {
            background: rgba(255, 170, 0, 0.2);
            color: #ffbb33;
        }

        .risk-low {
            background: rgba(0, 255, 136, 0.2);
            color: #00c864;
        }

        .history-toggle {
            width: 100%;
            margin-top: 8px;
            padding: 6px;
            background: none;
            border: 1px solid #4a3c00;
            border-radius: 7px;
            color: #9aa0a6;
            font-size: 11px;
            cursor: pointer;
            text-align: center;
        }

        .history-toggle:hover { border-color: #d4a200; color: #d4a200; }

        /* Scan detail panel */
        .scan-detail {
            display: none;
            flex-direction: column;
            gap: 12px;
            padding: 16px 20px;
        }

        .scan-detail.visible { display: flex; }

        .detail-back {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            color: #9aa0a6;
            font-size: 12px;
            cursor: pointer;
            padding: 0;
            margin-bottom: 4px;
        }

        .detail-back:hover { color: #d4a200; }

        .detail-card {
            background: #221c00;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #4a3c00;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .detail-risk-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .detail-risk-badge {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .detail-score-ring {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .detail-score-value {
            font-size: 32px;
            font-weight: 800;
            line-height: 1;
        }

        .detail-score-label {
            font-size: 10px;
            color: #9aa0a6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .detail-field {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .detail-field-label {
            font-size: 10px;
            color: #9aa0a6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-field-value {
            font-size: 13px;
            color: #e8eaed;
            word-break: break-all;
        }

        .detail-divider {
            border: none;
            border-top: 1px solid #4a3c00;
            margin: 0;
        }

        .footer {
            padding: 16px 20px;
            background: #0d0900;
            border-top: 1px solid #4a3c00;
            text-align: center;
        }

        .website-link {
            display: inline-block;
            padding: 10px 20px;
            background: linear-gradient(135deg, #d4a200, #c8a800);
            color: #0d0900;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: transform 0.2s;
        }

        .website-link:hover {
            transform: translateY(-2px);
        }

        .no-scans {
            text-align: center;
            padding: 30px 20px;
            color: #9aa0a6;
            font-size: 13px;
        }

        /* Profile / Auth */
        .profile-section {
            padding: 16px 20px;
            border-top: 1px solid #4a3c00;
        }

        .profile-logged-in {
            display: none;
            align-items: center;
            gap: 10px;
            background: #221c00;
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #4a3c00;
        }

        .profile-logged-in.show { display: flex; }

        .profile-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #d4a200, #c8a800);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #0d0900;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .profile-info { flex: 1; }
        .profile-name { font-weight: 700; font-size: 13px; }
        .profile-email { font-size: 11px; color: #9aa0a6; }

        .profile-signout {
            background: none;
            border: 1px solid #4a3c00;
            color: #9aa0a6;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        .profile-signout:hover { border-color: #ff3366; color: #ff3366; }

        .auth-section { display: block; }

        .auth-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        .auth-tab {
            flex: 1;
            padding: 6px;
            background: #221c00;
            border: 1px solid #4a3c00;
            border-radius: 7px;
            color: #9aa0a6;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .auth-tab.active {
            background: linear-gradient(135deg, #d4a200, #c8a800);
            color: #0d0900;
            border-color: transparent;
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 7px;
        }

        .auth-form.active { display: flex; }

        .auth-input {
            padding: 8px 10px;
            background: #221c00;
            border: 1px solid #4a3c00;
            border-radius: 8px;
            color: #e8eaed;
            font-size: 12px;
            outline: none;
        }

        .auth-input:focus { border-color: #d4a200; }

        .auth-submit {
            padding: 8px;
            background: linear-gradient(135deg, #d4a200, #c8a800);
            border: none;
            border-radius: 8px;
            color: #0d0900;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .auth-msg {
            text-align: center;
            font-size: 11px;
            min-height: 14px;
        }

        .auth-msg.success { color: #d4a200; }
        .auth-msg.error { color: #ff3366; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo"><img src="cyberhunter_ext.png" alt="CyberHunter" style="width:40px;height:40px;object-fit:contain;"></div>
        <h1>CyberHunter</h1>
        <p class="tagline">AI-Powered Email Protection</p>
    </div>

    <div class="content">
        <div class="status-card">
            <div class="status-header">
                <div class="status-icon">✓</div>
                <div class="status-text">
                    <div class="status-title">Protection Active</div>
                    <div class="status-subtitle" id="statusSubtitle">Monitoring your emails</div>
                </div>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid #4a3c00;">
                <span style="font-size:12px;color:#c8a800;" id="siteToggleLabel">Scanning enabled</span>
                <label style="position:relative;display:inline-block;width:42px;height:22px;cursor:pointer;">
                    <input type="checkbox" id="siteToggle" checked style="opacity:0;width:0;height:0;">
                    <span id="siteToggleTrack" style="position:absolute;inset:0;background:#4a3c00;border-radius:22px;transition:0.3s;">
                        <span id="siteToggleThumb" style="position:absolute;top:3px;left:3px;width:16px;height:16px;background:#c8a800;border-radius:50%;transition:0.3s;"></span>
                    </span>
                </label>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-value" id="totalScans">0</div>
                <div class="stat-label">Total Scans</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="threatsBlocked">0</div>
                <div class="stat-label">Threats Blocked</div>
            </div>
        </div>

        <div class="recent-scans">
            <div class="section-title">Recent Scans</div>
            <div class="scan-list-wrapper" id="scanListWrapper">
                <div id="scanList">
                    <div class="no-scans">No scans yet. Open an email to see protection in action!</div>
                </div>
            </div>
            <button class="history-toggle" id="historyToggle" style="display:none;">Show more</button>
        </div>
    </div>

    <!-- Scan detail panel (shown when a scan item is clicked) -->
    <div class="scan-detail" id="scanDetail">
        <button class="detail-back" id="detailBack">&#8592; Back to scans</button>
        <div class="detail-card">
            <div class="detail-risk-row">
                <div class="detail-score-ring">
                    <div class="detail-score-value" id="detailScore">—</div>
                    <div class="detail-score-label">Risk Score</div>
                </div>
                <span class="detail-risk-badge" id="detailBadge">—</span>
            </div>
            <hr class="detail-divider">
            <div class="detail-field">
                <div class="detail-field-label">Subject</div>
                <div class="detail-field-value" id="detailSubject">—</div>
            </div>
            <div class="detail-field">
                <div class="detail-field-label">Sender / URL</div>
                <div class="detail-field-value" id="detailUrl">—</div>
            </div>
            <div class="detail-field">
                <div class="detail-field-label">Scanned</div>
                <div class="detail-field-value" id="detailTime">—</div>
            </div>
        </div>
    </div>

    <!-- Profile / Auth -->
    <div class="profile-section">
        <!-- Logged in state -->
        <div class="profile-logged-in" id="extLoggedIn">
            <div class="profile-avatar" id="extAvatar">U</div>
            <div class="profile-info">
                <div class="profile-name" id="extUserName">User</div>
                <div class="profile-email" id="extUserEmail"></div>
            </div>
            <button class="profile-signout" id="extSignOut">Sign Out</button>
        </div>

        <!-- Auth forms -->
        <div id="extAuthForms">
            <div class="auth-tabs">
                <button class="auth-tab active" id="extTabLogin">Log In</button>
                <button class="auth-tab" id="extTabSignup">Sign Up</button>
            </div>

            <form class="auth-form active" id="extLoginForm">
                <input class="auth-input" type="email" id="extLoginEmail" placeholder="Email" required>
                <input class="auth-input" type="password" id="extLoginPassword" placeholder="Password" required>
                <button class="auth-submit" type="submit">Log In</button>
                <div class="auth-msg" id="extLoginMsg"></div>
            </form>

            <form class="auth-form" id="extSignupForm">
                <input class="auth-input" type="text" id="extSignupName" placeholder="Full Name" required>
                <input class="auth-input" type="email" id="extSignupEmail" placeholder="Email" required>
                <input class="auth-input" type="password" id="extSignupPassword" placeholder="Password (min 6 chars)" required>
                <button class="auth-submit" type="submit">Create Account</button>
                <div class="auth-msg" id="extSignupMsg"></div>
            </form>
        </div>
    </div>

    <div class="footer">
        <a href="#" class="website-link" id="websiteLink">View Full Dashboard</a>
    </div>

    <script src="popup.js"></script>
</body>
</html>
